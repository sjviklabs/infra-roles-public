---
- name: Create node_exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create node_exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check installed node_exporter version
  ansible.builtin.command: "{{ node_exporter_install_dir }}/node_exporter --version"
  register: ne_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

# Private, unpredictable download dir: a fixed /tmp path lets another local
# user pre-plant or swap the archive before root installs it.
- name: Create private download directory
  ansible.builtin.tempfile:
    state: directory
    suffix: node_exporter
  register: ne_tmp
  when: >
    ne_installed_version.rc != 0 or
    node_exporter_version not in ne_installed_version.stdout

- name: Download node_exporter (checksum-verified)
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "{{ ne_tmp.path }}/node_exporter.tar.gz"
    checksum: "{{ node_exporter_checksum }}"
    mode: "0600"
  when: ne_tmp.path is defined

- name: Extract node_exporter binary
  ansible.builtin.unarchive:
    src: "{{ ne_tmp.path }}/node_exporter.tar.gz"
    dest: "{{ ne_tmp.path }}"
    remote_src: true
  when: not ansible_check_mode and ne_tmp.path is defined

# Root-owned: the service account must not be able to rewrite its own binary.
- name: Install node_exporter binary
  ansible.builtin.copy:
    src: "{{ ne_tmp.path }}/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode and ne_tmp.path is defined
  notify: restart node_exporter

# Also corrects hosts installed by earlier versions of this role.
- name: Ensure node_exporter binary is root-owned
  ansible.builtin.file:
    path: "{{ node_exporter_install_dir }}/node_exporter"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode

- name: Template node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Remove download directory
  ansible.builtin.file:
    path: "{{ ne_tmp.path }}"
    state: absent
  when: ne_tmp.path is defined