---
# Role requirements (derived from audit/container-state.md — LXC 100):
# 1. Install AdGuardHome binary (idempotent: check version before re-downloading)
# 2. Create /etc/systemd/system/AdGuardHome.service unit file
# 3. Enable and start AdGuardHome.service
# 4. alloy + wazuh-agent handled by their respective cross-cutting roles

- name: Create adguard system user
  ansible.builtin.user:
    name: "{{ adguard_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ adguard_install_dir }}"
    create_home: false

- name: Ensure AdGuardHome install directory exists
  ansible.builtin.file:
    path: "{{ adguard_install_dir }}"
    state: directory
    owner: "{{ adguard_user }}"
    group: "{{ adguard_group }}"
    mode: "0755"

- name: Check AdGuardHome installed version
  ansible.builtin.command: "{{ adguard_binary }} --version"
  register: adguard_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

# Private, unpredictable download dir: a fixed /tmp path lets another local
# user pre-plant or swap the archive before root installs it.
- name: Create private download directory
  ansible.builtin.tempfile:
    state: directory
    suffix: adguard
  register: adguard_tmp
  when: >
    adguard_installed_version.rc != 0 or
    adguard_version not in adguard_installed_version.stdout

- name: Download AdGuardHome tarball (checksum-verified)
  ansible.builtin.get_url:
    url: "{{ adguard_download_url }}"
    dest: "{{ adguard_tmp.path }}/AdGuardHome.tar.gz"
    checksum: "{{ adguard_checksum }}"
    mode: "0600"
  when: adguard_tmp.path is defined

- name: Extract AdGuardHome binary
  ansible.builtin.unarchive:
    src: "{{ adguard_tmp.path }}/AdGuardHome.tar.gz"
    dest: "{{ adguard_tmp.path }}"
    remote_src: true
  when: not ansible_check_mode and adguard_tmp.path is defined

# Root-owned and outside the service's writable working directory, so the
# service account can neither modify nor replace it.
- name: Install AdGuardHome binary
  ansible.builtin.copy:
    src: "{{ adguard_tmp.path }}/AdGuardHome/AdGuardHome"
    dest: "{{ adguard_binary }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  when: not ansible_check_mode and adguard_tmp.path is defined
  notify: restart adguard

# Earlier versions of this role installed a service-owned binary inside the
# working directory. Remove it so nothing can start the writable copy.
- name: Remove legacy in-place AdGuardHome binary
  ansible.builtin.file:
    path: "{{ adguard_install_dir }}/AdGuardHome"
    state: absent
  when: adguard_binary != adguard_install_dir ~ '/AdGuardHome'
  notify: restart adguard

- name: Deploy AdGuardHome systemd unit
  ansible.builtin.template:
    src: AdGuardHome.service.j2
    dest: /etc/systemd/system/AdGuardHome.service
    owner: root
    group: root
    mode: "0644"
  notify: restart adguard

- name: Enable and start AdGuardHome service
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: true
    state: started
    daemon_reload: true

- name: Remove download directory
  ansible.builtin.file:
    path: "{{ adguard_tmp.path }}"
    state: absent
  when: adguard_tmp.path is defined